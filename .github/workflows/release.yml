name: Publicar Release Automático

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Generar el archivo ejecutable app.zip
        run: mvn clean javafx:jlink

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: target/app.zip
          body: "Lanzamiento automático generado por GitHub Actions para la versión ${{ github.ref_name }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}